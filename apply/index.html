<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GD Avenue staff applications and punishment appeals">
  <meta name="theme-color" content="#0a0c0f"><meta name="robots" content="noindex,nofollow">
  <title>Applications &amp; Appeals | GD Avenue</title>
  <link rel="stylesheet" href="../staff/staff.css">
</head>
<body>
  <main class="application-page">
    <header class="public-app-head"><div><a href="/" class="quiet-link">GD Avenue</a> <a href="/privacy.html" class="quiet-link">Privacy Policy</a></div><button id="apply-logout" class="icon-link" type="button">Log out</button></header>
    <section class="application-shell">
      <p class="eyebrow">GD Avenue team</p>
      <h1 id="apply-title">Applications and appeals</h1>
      <p id="apply-intro" class="muted">Choose a staff application or securely appeal a GD Avenue punishment. Your Discord identity is verified before anything is stored.</p>
      <div id="apply-auth" class="panel" hidden><p id="apply-auth-message">Sign in with Discord to begin.</p><div class="dialog-actions"><button id="apply-clear-auth" class="button secondary" type="button">Clear old sign-in</button><a class="button primary" href="/api/auth/login?return=apply">Continue with Discord</a></div></div>
      <div id="apply-content">
        <div class="loading-state"><span class="spinner"></span>Loading application</div>
      </div>
    </section>
  </main>
  <script src="apply.js" defer></script>
</body>
</html>
